# Muslinx Foot Terminal Configuration
# Islamic art-inspired dark theme

[main]
font=IBM Plex Mono:size=11
dpi-aware=yes
pad=12x12
initial-window-size-chars=100x35

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
blink=yes
color=0d1117 2ec4b6

[mouse]
hide-when-typing=yes

[colors]
# Muslinx Night Sky palette
background=0d1117
foreground=c9d1e0
selection-foreground=0d1117
selection-background=2ec4b6

## Normal colors
regular0=1c2233   # black   (surface)
regular1=e8637a   # red     (rose)
regular2=2ec4b6   # green   (turquoise)
regular3=d4a853   # yellow  (gold)
regular4=3d4f7a   # blue    (border-glow)
regular5=c678dd   # magenta (amethyst)
regular6=56b6c2   # cyan    (light turquoise)
regular7=c9d1e0   # white   (text)

## Bright colors
bright0=2a3350    # bright black  (border)
bright1=f0886c    # bright red    (coral)
bright2=45d4c6    # bright green  (light turquoise)
bright3=e8c97a    # bright yellow (light gold)
bright4=5a7abf    # bright blue
bright5=d899ef    # bright magenta
bright6=73d0cc    # bright cyan
bright7=f0ead6    # bright white  (ivory)

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+equal
spawn-terminal=Control+Shift+n
