# Muslinx GRUB Configuration

set default=0
set timeout=5
set gfxmode=auto

# Load graphics modules
insmod all_video
insmod gfxterm
terminal_output gfxterm

# Try to load Muslinx GRUB theme
if [ -f /boot/grub/theme/theme.txt ]; then
    set theme=/boot/grub/theme/theme.txt
fi

# Colors (Muslinx palette)
set color_normal=light-cyan/black
set color_highlight=yellow/black

menuentry "Muslinx Linux (Live)" --class muslinx --class linux {
    echo "Loading Muslinx kernel..."
    linux /boot/vmlinuz quiet splash
    echo "Loading initramfs..."
    initrd /boot/initramfs.img
    echo "Booting..."
}

menuentry "Muslinx Linux (Live - Verbose)" --class muslinx --class linux {
    linux /boot/vmlinuz loglevel=7
    initrd /boot/initramfs.img
}

menuentry "Muslinx Linux (Console Only)" --class muslinx --class linux {
    linux /boot/vmlinuz quiet 3
    initrd /boot/initramfs.img
}

menuentry "System Shutdown" --class shutdown {
    halt
}

menuentry "System Restart" --class restart {
    reboot
}
