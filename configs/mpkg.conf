# Muslinx Package Manager (mpkg) Configuration

[general]
# Package database location
db_dir = /var/lib/mpkg
# Package cache
cache_dir = /var/cache/mpkg
# Build directory for source packages
build_dir = /tmp/mpkg-build

[repositories]
# Main Muslinx repository
main = https://repo.muslinx.org/packages
# Community packages
community = https://repo.muslinx.org/community

[build]
# Default compiler flags
CFLAGS = -O2 -pipe -march=x86-64 -mtune=generic
CXXFLAGS = ${CFLAGS}
LDFLAGS = -Wl,-O1,--sort-common,--as-needed,-z,relro,-z,now
MAKEFLAGS = -j$(nproc)

[options]
# Check package signatures
verify_signatures = true
# Clean build directory after install
clean_after_build = true
# Show download progress
show_progress = true
# Compression for built packages
compression = zstd
